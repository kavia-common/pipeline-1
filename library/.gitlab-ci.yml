benchmark-rs:
  extends: .base-rs
  stage: testNonFunctional
  needs: [test-rs]
  script:
    - cargo bench --verbose
  when: manual
    
documentation-rs:
  extends: .base-rs
  stage: release
  needs: [test-rs]
  script:
    - cargo rustdoc --verbose
  when: manual
