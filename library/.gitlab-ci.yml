include:
  - 'base.gitlab-ci.yml'

.base-rs:
  image: rust:latest
  rules:
    - changes:
        - "**/*"

build-rs:
  extends: .base-rs
  stage: build
  script:
    - cargo build --verbose

build-rs-nightly:
  extends: .base-rs
  stage: build
  image: rustlang/rust:nightly
  script:
    - cargo build --verbose
  when: manual

lint-rs:
  extends: .base-rs
  stage: buildNonFunctional
  needs: [build-rs]
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --verbose

dependencies-outdated-rs:
  extends: .base-rs
  stage: buildNonFunctional
  needs: [build-rs]
  script:
      - cargo update --verbose
      - cargo build --verbose
  when: manual

dependencies-unused-rs:
  extends: .base-rs
  stage: buildNonFunctional
  needs: [build-rs]
  before_script:
    - cargo install cargo-udeps --locked
  script:
      - cargo +nightly udeps --all-targets
  when: manual

version-rs:
  extends: .base-rs
  stage: buildNonFunctional
  needs: [build-rs]
  script:
      - cargo update --verbose
      - cargo hack check --rust-version --workspace --all-targets --ignore-private
  when: manual

