documentation-server:
  extends: .base-server
  stage: release
  needs: [test-server]
  script:
    - cargo rustdoc --verbose
  when: manual

.deploy-service-server:
  extends: .deploy-server
  variables:
    AWS_REGION: $AWS_REGION
    AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID
    AWS_ECR_URL: $AWS_ECR_URL
    REPO: $SERVER_REPO
    TAG_LATEST: $SERVER_TAG_LATEST
    TAG_COMMIT: $SERVER_TAG_COMMIT
    DOCKERFILE: server/docker/Dockerfile
    CONTEXT: server/.
    BUILD_ARGS: --build-arg AUTH_TOKEN=$CI_JOB_TOKEN
    IMAGE_NAME: $SERVER_IMAGE_NAME
    AWS_ECS_TASK_DEFINITION: $CI_AWS_ECS_TASK_DEFINITION
    AWS_ECS_CLUSTER: $CI_AWS_ECS_CLUSTER
    AWS_ECS_SERVICE: $CI_AWS_ECS_SERVICE
    AWS_ECS_TASK_IMAGE_NAME: $AWS_ECS_TASK_IMAGE_NAME_SERVER

deploy-int-server:
  extends: .deploy-service-server
  stage: internal
  needs: [test-server] # [build-container-server]
  environment:
    name: internal
    url: https://$CLIENT_CODE.int.deepvisibility.co
    deployment_tier: testing
  when: on_success

deploy-prod-server:
  extends: .deploy-service-server
  stage: production
  needs: [deploy-int-server]
  environment:
    name: production
    url: https://$CLIENT_DOMAIN
    deployment_tier: production
    