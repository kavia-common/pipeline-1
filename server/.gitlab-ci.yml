include:
  - 'base.gitlab-ci.yml'

.base-server:
  image: rust:latest
  before_script:
    - cd server/
    - apt-get update
    - apt-get install -y protobuf-compiler
    - git config --global credential.helper store
    - echo "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com" > ~/.git-credentials
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com".insteadOf ssh://git@gitlab.com
    
  rules:
    - changes:
        - server/**/*
    
.amazon-server:
  extends: .amazon
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - server/**/*

.deploy-server:
  extends: .deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - server/**/*

variables:
  SERVER_IMAGE_NAME: $CLIENT_CODE/server
  SERVER_TAG_LATEST: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$SERVER_IMAGE_NAME:latest
  SERVER_TAG_COMMIT: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$SERVER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  
build-server:
  extends: .base-server
  stage: build
  script:
    - cargo build --verbose

build-server-nightly:
  extends: .base-server
  stage: build
  image: rustlang/rust:nightly
  script:
    - cargo build --verbose
  when: manual

lint-server:
  extends: .base-server
  stage: buildNonFunctional
  needs: [build-server]
  before_script:
    - cd server/
    - rustup component add clippy
    - apt-get update
    - apt-get install -y protobuf-compiler
    - git config --global credential.helper store
    - echo "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com" > ~/.git-credentials
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com".insteadOf ssh://git@gitlab.com
  script:
    - cargo clippy --verbose

dependencies-outdated-server:
  extends: .base-server
  stage: buildNonFunctional
  needs: [build-server]
  script:
      - cargo update --verbose
      - cargo build --verbose
  when: manual

dependencies-unused-server:
  extends: .base-server
  stage: buildNonFunctional
  needs: [build-server]
  before_script:
    - cd server/
    - apt-get update
    - apt-get install -y protobuf-compiler
    - git config --global credential.helper store
    - echo "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com" > ~/.git-credentials
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com".insteadOf ssh://git@gitlab.com
    - cargo install cargo-udeps --locked
  script:
      - cargo +nightly udeps --all-targets
  when: manual

version-server:
  extends: .base-server
  stage: buildNonFunctional
  needs: [build-server]
  script:
      - cargo update --verbose
      - cargo hack check --rust-version --workspace --all-targets --ignore-private
  when: manual

test-server:
  extends: .base-server
  stage: test
  needs: [build-server]
  # image: docker:stable
  # services:
  #   - docker:dind
  script:
    - cargo test --verbose

